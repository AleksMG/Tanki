class Tank {
    constructor(id, name, team, pos, rng) {
        this.id = id;
        this.name = name;
        this.team = team;
        this.color = team === 'blue' ? '#00f0ff' : '#ff2a2a';
        this.pos = new Vector2(pos.x, pos.y);
        this.vel = new Vector2(0, 0);
        this.acc = new Vector2(0, 0);
        this.angle = rng.next() * TAU;
        this.turret = this.angle;
        this.hp = 100;
        this.maxHp = 100;
        this.alive = true;
        this.reload = 0;
        this.reloadTime = 22;
        this.respawn = 0;
        this.kills = 0;
        this.deaths = 0;
        this.damage = 0;
        this.shots = 0;
        this.hits = 0;
        this.wins = 0;
        this.trail = [];
        this.wanderAng = rng.next() * TAU;
        this.currentTarget = null;
        this.lastTactic = 0;
        this.lastAction = new Float32Array(LOW_DIM);
        this.lastTacticsProbs = new Float32Array(N_TACTICS);
        this.lastTargetIdx = 0;
        this.lastTargetScores = new Float32Array(MAX_ENEMIES);
        this.lastTargetProbs = new Float32Array(MAX_ENEMIES);
        this.lastValue = 0;
        this.trajectory = [];
        this.rng = rng.fork((id * 7919) + 1);
        this.recentDamage = 0;
        this.maxSpeed = 2.8;
        this.maxForce = 0.15;
        this.maxAngularVel = 0.12;
    }
}

class Bullet {
    constructor(x, y, vx, vy, ownerId, team, dmg, shotTick) {
        this.pos = new Vector2(x, y);
        this.vel = new Vector2(vx, vy);
        this.ownerId = ownerId;
        this.team = team;
        this.dmg = dmg;
        this.life = 110;
        this.shotTick = shotTick;
    }
}

const sim = {
    AW: 1100,
    AH: 760,
    tanks: [],
    bullets: [],
    walls: [],
    tick: 0,
    round: 1,
    episode: 0,
    running: false,
    speed: 2,
    tankCount: 6,
    selected: 0,
    trajectoryBuffer: new TrajectoryBuffer(40),
    log: [],
    rng: new SeededRNG(Date.now()),
    combatCore: new CombatCore(),
    accumulator: 0
};

let sharedPolicy = null;
let trainer = null;
let isTraining = false;

/* ═══════════════════════════════════════════════════════════════════════
   8. CORE SIMULATION LOOP (FULLY EXPANDED)
═══════════════════════════════════════════════════════════════════════ */

function initBrain() {
    const rng = new SeededRNG(Date.now());
    sharedPolicy = new PolicyNet(rng);
    trainer = new PPOTrainer(sharedPolicy, 0.0004);
}

function genWalls(rng) {
    const walls = [];
    for (let i = 0; i < 6; i++) {
        const w = 60 + (rng.next() * 120);
        const h = 14 + (rng.next() * 18);
        const horizontal = rng.next() > 0.5;
        const ww = horizontal ? w : h;
        const hh = horizontal ? h : w;
        walls.push({
            x: 70 + (rng.next() * (sim.AW - 140 - ww)),
            y: 70 + (rng.next() * (sim.AH - 140 - hh)),
            w: ww,
            h: hh
        });
    }
    return walls;
}

function findSpawn(rng) {
    for (let i = 0; i < 100; i++) {
        const x = 40 + (rng.next() * (sim.AW - 80));
        const y = 40 + (rng.next() * (sim.AH - 80));
        
        // FIX #6: Проверка всех 4 углов bounding box для предотвращения спавна углом в стену
        if (!pointInWall(x, y, sim.walls) &&
            !pointInWall(x - 20, y - 20, sim.walls) &&
            !pointInWall(x + 20, y - 20, sim.walls) &&
            !pointInWall(x - 20, y + 20, sim.walls) &&
            !pointInWall(x + 20, y + 20, sim.walls)) {
            
            let ok = true;
            for (let j = 0; j < sim.tanks.length; j++) {
                const t = sim.tanks[j];
                if (t.alive && dist(t.pos, {x: x, y: y}) < 120) {
                    ok = false;
                    break;
                }
            }
            if (ok) {
                return { x: x, y: y };
            }
        }
    }
    return { x: sim.AW / 2, y: sim.AH / 2 };
}

function initRound() {
    sim.bullets = [];
    sim.walls = genWalls(sim.rng.fork((sim.round * 31) + 7));
    sim.tanks = [];
    sim.combatCore.targetAssignments.clear();
    
    const names = ['ALPHA', 'BRAVO', 'CHARLIE', 'DELTA', 'ECHO', 'FOXTROT'];
    for (let i = 0; i < sim.tankCount; i++) {
        // FIX #7: Fallback для имён при tankCount > 6
        const name = names[i] !== undefined ? names[i] : 'UNIT-' + (i + 1);
        const pos = findSpawn(sim.rng);
        sim.tanks.push(new Tank(i, name, i < 3 ? 'blue' : 'red', pos, sim.rng));
    }
    
    // FIX: Clamp selected
    sim.selected = clamp(sim.selected, 0, sim.tanks.length - 1);
    addLog('Раунд ' + sim.round + ' начался.', 'log-s');
}

function addLog(msg, cls) {
    const c = cls !== undefined ? cls : '';
    sim.log.unshift({ t: sim.tick, msg: msg, cls: c });
    if (sim.log.length > 50) {
        sim.log.pop();
    }
}

const R_LIFE = 0.001;
const R_AIM = 0.003;
const R_DIST = 0.002;
const R_DODGE = 0.04;
const R_HIT = 1.5;
const R_KILL = 3.0;
const R_DAMAGE = -0.01;
const R_DEATH = -10.0;
const R_WIN = 5.0;

function stepPhysics() {
    sim.tick = sim.tick + 1;
    
    const alive = [];
    for (let i = 0; i < sim.tanks.length; i++) {
        if (sim.tanks[i].alive) {
            alive.push(sim.tanks[i]);
        }
    }
    
    if (alive.length <= 1) {
        if (alive.length === 1) {
            addLog('🏆 ' + alive[0].name + ' ПОБЕДА', 'log-w');
            alive[0].wins = alive[0].wins + 1;
        }
        endRound();
        return;
    }
    
    for (let i = 0; i < sim.tanks.length; i++) {
        if (sim.tanks[i].alive) {
            sim.tanks[i].recentDamage = sim.tanks[i].recentDamage * 0.9;
        }
    }
    
    if (sim.tick % 20 === 0) {
        sim.combatCore.targetAssignments = sim.combatCore.assignTargetsGlobal(sim.tanks);
    }
    
    for (let i = 0; i < sim.tanks.length; i++) {
        const tank = sim.tanks[i];
        if (!tank.alive) {
            tank.respawn = tank.respawn - 1;
            if (tank.respawn <= 0) {
                respawn(tank);
            }
            continue;
        }
        
        if (tank.reload > 0) {
            tank.reload = tank.reload - 1;
        }
        
        const sensors = buildSensors(tank, sim.tanks, sim.bullets, sim.walls, sim.AW, sim.AH);
        const decision = sharedPolicy.forward(sensors, tank.rng);
        
        const assignedEnemyId = sim.combatCore.targetAssignments.get(tank.id);
        let target = null;
        
        if (assignedEnemyId !== undefined) {
            for (let j = 0; j < sim.tanks.length; j++) {
                if (sim.tanks[j].alive && sim.tanks[j].id === assignedEnemyId) {
                    target = sim.tanks[j];
                    break;
                }
            }
        }
        
        // FIX #3: Приоритетное использование decision.targetIdx
        const enemies = [];
        for (let j = 0; j < sim.tanks.length; j++) {
            if (sim.tanks[j].alive && sim.tanks[j].team !== tank.team) {
                enemies.push({ e: sim.tanks[j], d: dist(tank.pos, sim.tanks[j].pos) });
            }
        }
        enemies.sort(function(a, b) {
            return a.d - b.d;
        });
        
        if (decision.targetIdx >= 0 && decision.targetIdx < enemies.length && decision.targetScores[decision.targetIdx] > -50) {
            target = enemies[decision.targetIdx].e;
        }
        
        if (!target && enemies.length > 0) {
            target = enemies[0].e;
        }
        
        tank.currentTarget = target;
        tank.lastTactic = decision.tactic;
        tank.lastAction = decision.action.slice();
        tank.lastTacticsProbs = decision.tacticsProbs.slice();
        tank.lastTargetIdx = decision.targetIdx;
        tank.lastTargetScores = decision.targetScores.slice();
        tank.lastTargetProbs = decision.targetProbs.slice();
        tank.lastValue = decision.value;
        
        let desiredAngle = tank.angle;
        let speedMult = 0.5;
        
        if (target !== null) {
            const toTarget = Math.atan2(target.pos.y - tank.pos.y, target.pos.x - tank.pos.x);
            const d = dist(tank.pos, target.pos);
            const interceptTime = d / 7;
            const predX = target.pos.x + (target.vel.x * interceptTime);
            const predY = target.pos.y + (target.vel.y * interceptTime);
            const pursuitAng = Math.atan2(predY - tank.pos.y, predX - tank.pos.x);
            
            if (decision.tactic === 0) {
                desiredAngle = toTarget;
                speedMult = 1.0;
            } else if (decision.tactic === 1) {
                if (d > 250) {
                    desiredAngle = toTarget;
                } else {
                    desiredAngle = normAng(toTarget + ((Math.PI / 2) * -1));
                }
                speedMult = 0.8;
            } else if (decision.tactic === 2) {
                if (d > 250) {
                    desiredAngle = toTarget;
                } else {
                    desiredAngle = normAng(toTarget + ((Math.PI / 2) * 1));
                }
                speedMult = 0.8;
            } else if (decision.tactic === 3) {
                const err = (d - 240) / 240;
                desiredAngle = normAng(toTarget + clamp(err, -0.5, 0.5));
                speedMult = 0.7;
            } else if (decision.tactic === 4) {
                desiredAngle = Math.atan2(decision.action[4], decision.action[3]);
                speedMult = 1.2;
            } else if (decision.tactic === 5) {
                desiredAngle = normAng(toTarget + Math.PI);
                speedMult = 0.9;
            } else if (decision.tactic === 6) {
                desiredAngle = normAng(toTarget + Math.PI);
                speedMult = 0.4;
            } else if (decision.tactic === 7) {
                desiredAngle = tank.wanderAng;
                tank.wanderAng = tank.wanderAng + 0.03;
                speedMult = 0.5;
            }
            
            desiredAngle = normAng(desiredAngle + (angDiff(pursuitAng, desiredAngle) * 0.4));
            
            const leadAim = sim.combatCore.calculateLeadShot(tank, target, 7);
            const desiredAim = leadAim + (clamp(decision.action[1], -1, 1) * 0.3);
            tank.turret = tank.turret + clamp(angDiff(desiredAim, tank.turret), -tank.maxAngularVel, tank.maxAngularVel);
            
            const aimError = Math.abs(angDiff(tank.turret, leadAim));
            const fireProb = clamp(((1 - (aimError / 0.3)) * 0.8) + (decision.action[2] * 0.2), 0, 1);
            
            if (tank.reload <= 0 && tank.rng.next() < fireProb && sim.combatCore.isLineOfSightClear(tank, target, sim.tanks, sim.walls)) {
                tank.reload = tank.reloadTime;
                tank.shots = tank.shots + 1;
                const bx = tank.pos.x + (Math.cos(tank.turret) * 24);
                const by = tank.pos.y + (Math.sin(tank.turret) * 24);
                const vx = Math.cos(tank.turret) * 7;
                const vy = Math.sin(tank.turret) * 7;
                sim.bullets.push(new Bullet(bx, by, vx, vy, tank.id, tank.team, 12, sim.tick));
            }
        } else {
            tank.turret = tank.turret + clamp(angDiff(tank.wanderAng, tank.turret), -tank.maxAngularVel, tank.maxAngularVel);
        }
        
        const force = new Vector2(Math.cos(desiredAngle), Math.sin(desiredAngle));
        force.mult(tank.maxForce * speedMult);
        tank.acc.add(force);
        tank.vel.add(tank.acc);
        
        if (tank.vel.mag() > tank.maxSpeed) {
            tank.vel.normalize().mult(tank.maxSpeed);
        }
        tank.vel.mult(0.92);
        tank.acc.mult(0);
        
        const nextX = tank.pos.x + tank.vel.x;
        const nextY = tank.pos.y + tank.vel.y;
        let blocked = false;
        
        if (pointInWall(nextX, nextY, sim.walls) || nextX < 16 || nextX > sim.AW - 16 || nextY < 16 || nextY > sim.AH - 16) {
            blocked = true;
        }
        
        for (let j = 0; j < sim.tanks.length; j++) {
            const other = sim.tanks[j];
            if (other.id !== tank.id && other.alive && dist({x: nextX, y: nextY}, other.pos) < 32) {
                blocked = true;
                break;
            }
        }
        
        if (blocked) {
            tank.vel.mult(0.0);
        } else {
            tank.pos.x = nextX;
            tank.pos.y = nextY;
        }
        tank.angle = normAng(tank.angle + (angDiff(desiredAngle, tank.angle) * 0.2));
        
        tank.trajectory.push({
            state: sensors,
            tactic: decision.tactic,
            value: decision.value,
            tacticsProbs: decision.tacticsProbs,
            action: decision.action,
            actionSamples: decision.actionSamples,
            lowLogProb: decision.lowLogProb,
            targetIdx: decision.targetIdx,
            targetScores: decision.targetScores,
            targetProbs: decision.targetProbs,
            validCount: decision.validCount,
            enemyFeatures: decision.enemyFeatures,
            reward: 0,
            tick: sim.tick
        });
        
        if (tank.trajectory.length > 1500) {
            const chunk = tank.trajectory.splice(0, 1000);
            const lastState = chunk[chunk.length - 1].state;
            const bootstrap = sharedPolicy.forwardValue(lastState);
            sim.trajectoryBuffer.addEpisode(chunk, bootstrap);
        }
        
        tank.trail.push({ x: tank.pos.x, y: tank.pos.y });
        if (tank.trail.length > 30) {
            tank.trail.shift();
        }
    }
    
    for (let i = sim.bullets.length - 1; i >= 0; i--) {
        const b = sim.bullets[i];
        b.pos.add(b.vel);
        let dead = false;
        
        if (b.life <= 0 || b.pos.x < 0 || b.pos.x > sim.AW || b.pos.y < 0 || b.pos.y > sim.AH) {
            dead = true;
        }
        if (!dead && pointInWall(b.pos.x, b.pos.y, sim.walls)) {
            dead = true;
        }
        
        if (!dead) {
            for (let j = 0; j < sim.tanks.length; j++) {
                const tank = sim.tanks[j];
                if (!tank.alive || tank.team === b.team) {
                    continue;
                }
                if (dist(tank.pos, b.pos) < 16) {
                    const shooter = sim.tanks[b.ownerId];
                    if (shooter !== undefined) {
                        shooter.damage = shooter.damage + b.dmg;
                        shooter.hits = shooter.hits + 1;
                        
                        let shotTr = undefined;
                        for (let k = 0; k < shooter.trajectory.length; k++) {
                            if (shooter.trajectory[k].tick === b.shotTick) {
                                shotTr = shooter.trajectory[k];
                                break;
                            }
                        }
                        
                        if (shotTr !== undefined) {
                            shotTr.reward = shotTr.reward + R_HIT;
                        } else if (shooter.trajectory.length > 0) {
                            const lastTr = shooter.trajectory[shooter.trajectory.length - 1];
                            lastTr.reward = lastTr.reward + R_HIT;
                        }
                    }
                    
                    if (tank.trajectory.length > 0) {
                        const lastTr = tank.trajectory[tank.trajectory.length - 1];
                        lastTr.reward = lastTr.reward + (R_DAMAGE * b.dmg);
                    }
                    
                    tank.hp = tank.hp - b.dmg;
                    tank.recentDamage = tank.recentDamage + b.dmg;
                    dead = true;
                    
                    if (tank.hp <= 0) {
                        killTank(tank, b.ownerId);
                    }
                    break;
                }
            }
        }
        
        if (dead) {
            sim.bullets.splice(i, 1);
        }
    }
    
    for (let i = 0; i < sim.tanks.length; i++) {
        const tank = sim.tanks[i];
        if (!tank.alive || tank.trajectory.length === 0) {
            continue;
        }
        const tr = tank.trajectory;
        const last = tr[tr.length - 1];
        last.reward = last.reward + R_LIFE;
        
        if (tank.currentTarget !== null) {
            const aimErr = Math.abs(angDiff(
                tank.turret,
                Math.atan2(tank.currentTarget.pos.y - tank.pos.y, tank.currentTarget.pos.x - tank.pos.x)
            ));
            const d = dist(tank.pos, tank.currentTarget.pos);
            if (aimErr < 0.25) {
                last.reward = last.reward + R_AIM;
            }
            if (d > 200 && d < 320) {
                last.reward = last.reward + R_DIST;
            }
        }
        
        if (tr.length >= 2) {
            const prevThreat = tr[tr.length - 2].state[BULLET_OFF + 0];
            const curThreat = last.state[BULLET_OFF + 0];
            if (prevThreat > 0.3 && curThreat < 0.1) {
                last.reward = last.reward + R_DODGE;
            }
        }
    }
}

function killTank(tank, killerId) {
    sim.combatCore.targetAssignments.delete(tank.id);
    if (tank.trajectory.length > 0) {
        tank.trajectory[tank.trajectory.length - 1].reward = tank.trajectory[tank.trajectory.length - 1].reward + R_DEATH;
    }
    sim.trajectoryBuffer.addEpisode(tank.trajectory, 0);
    tank.alive = false;
    tank.hp = 0;
    tank.deaths = tank.deaths + 1;
    tank.respawn = 130;
    tank.trajectory = [];
    
    let killer = null;
    if (killerId >= 0 && killerId < sim.tanks.length) {
        killer = sim.tanks[killerId];
    }
    
    if (killer !== null) {
        killer.kills = killer.kills + 1;
        if (killer.alive && killer.trajectory.length > 0) {
            killer.trajectory[killer.trajectory.length - 1].reward = killer.trajectory[killer.trajectory.length - 1].reward + R_KILL;
        }
        const posMsg = killer.alive ? '' : '(посмертно) ';
        addLog('💀 ' + killer.name + ' ' + posMsg + 'уничтожил ' + tank.name, 'log-k');
    }
}

function respawn(tank) {
    sim.combatCore.targetAssignments.delete(tank.id);
    const pos = findSpawn(tank.rng);
    tank.pos = new Vector2(pos.x, pos.y);
    tank.hp = tank.maxHp;
    tank.alive = true;
    tank.angle = tank.rng.next() * TAU;
    tank.turret = tank.angle;
    tank.vel = new Vector2(0, 0);
    tank.acc = new Vector2(0, 0);
    tank.reload = 0;
    tank.trail = [];
    tank.trajectory = [];
    tank.recentDamage = 0;
    addLog('↻ ' + tank.name + ' развернут', 'log-s');
}

function endRound() {
    for (let i = 0; i < sim.tanks.length; i++) {
        const tank = sim.tanks[i];
        if (tank.trajectory.length > 0) {
            let bootstrap = 0;
            if (tank.alive && tank.trajectory.length > 0) {
                const lastState = tank.trajectory[tank.trajectory.length - 1].state;
                bootstrap = sharedPolicy.forwardValue(lastState);
                tank.trajectory[tank.trajectory.length - 1].reward = tank.trajectory[tank.trajectory.length - 1].reward + R_WIN;
            }
            sim.trajectoryBuffer.addEpisode(tank.trajectory, bootstrap);
            tank.trajectory = [];
        }
    }
    sim.round = sim.round + 1;
    sim.episode = sim.episode + 1;
    initRound();
}

/* ═══════════════════════════════════════════════════════════════════════
   9. RENDER ENGINE (FULLY EXPANDED)
═══════════════════════════════════════════════════════════════════════ */

let canvas = null;
let ctx = null;
let dpr = 1;

function initRender() {
    canvas = document.getElementById('c');
    ctx = canvas.getContext('2d', { alpha: false });
    dpr = window.devicePixelRatio || 1;
    window.addEventListener('resize', resize);
    resize();
}

function resize() {
    const wrap = document.getElementById('arena-wrap');
    canvas.width = wrap.clientWidth * dpr;
    canvas.height = wrap.clientHeight * dpr;
    canvas.style.width = wrap.clientWidth + 'px';
    canvas.style.height = wrap.clientHeight + 'px';
}

function render() {
    const W = canvas.width;
    const H = canvas.height;
    ctx.fillStyle = '#050508';
    ctx.fillRect(0, 0, W, H);
    
    const scale = Math.min(W / sim.AW, H / sim.AH) * 0.92;
    const ox = (W - (sim.AW * scale)) / 2;
    const oy = (H - (sim.AH * scale)) / 2;
    
    ctx.save();
    ctx.translate(ox, oy);
    ctx.scale(scale, scale);
    
    ctx.strokeStyle = 'rgba(0, 240, 255, 0.03)';
    ctx.lineWidth = 1 / scale;
    for (let x = 0; x <= sim.AW; x = x + 50) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, sim.AH);
        ctx.stroke();
    }
    for (let y = 0; y <= sim.AH; y = y + 50) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(sim.AW, y);
        ctx.stroke();
    }
    
    ctx.strokeStyle = '#1a1a2e';
    ctx.lineWidth = 2 / scale;
    ctx.strokeRect(0, 0, sim.AW, sim.AH);
    
    for (let i = 0; i < sim.walls.length; i++) {
        const w = sim.walls[i];
        ctx.fillStyle = '#0f0f1a';
        ctx.fillRect(w.x, w.y, w.w, w.h);
        ctx.strokeStyle = '#2a2a4e';
        ctx.lineWidth = 1 / scale;
        ctx.strokeRect(w.x, w.y, w.w, w.h);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.02)';
        ctx.fillRect(w.x, w.y, w.w, 2);
    }
    
    for (let i = 0; i < sim.tanks.length; i++) {
        const t = sim.tanks[i];
        if (!t.alive || t.trail.length < 2) {
            continue;
        }
        ctx.beginPath();
        ctx.moveTo(t.trail[0].x, t.trail[0].y);
        for (let j = 1; j < t.trail.length; j++) {
            ctx.lineTo(t.trail[j].x, t.trail[j].y);
        }
        ctx.strokeStyle = t.color + '22';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        ctx.stroke();
    }
    
    for (let i = 0; i < sim.bullets.length; i++) {
        const b = sim.bullets[i];
        ctx.fillStyle = b.team === 'blue' ? '#00f0ff' : '#ff2a2a';
        ctx.shadowBlur = 8;
        ctx.shadowColor = ctx.fillStyle;
        ctx.beginPath();
        ctx.arc(b.pos.x, b.pos.y, 3, 0, TAU);
        ctx.fill();
        ctx.shadowBlur = 0;
    }
    
    const selT = sim.tanks[sim.selected];
    
    for (let i = 0; i < sim.tanks.length; i++) {
        const t = sim.tanks[i];
        if (!t.alive) {
            ctx.globalAlpha = 0.3;
            ctx.strokeStyle = t.color;
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(t.pos.x - 8, t.pos.y - 8);
            ctx.lineTo(t.pos.x + 8, t.pos.y + 8);
            ctx.moveTo(t.pos.x + 8, t.pos.y - 8);
            ctx.lineTo(t.pos.x - 8, t.pos.y + 8);
            ctx.stroke();
            ctx.globalAlpha = 1;
            continue;
        }
        
        const R = 16;
        
        if (t === selT && t.currentTarget !== null && t.currentTarget.alive) {
            ctx.strokeStyle = t.color + '66';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            ctx.moveTo(t.pos.x, t.pos.y);
            ctx.lineTo(t.currentTarget.pos.x, t.currentTarget.pos.y);
            ctx.stroke();
            ctx.setLineDash([]);
            
            const tLead = dist(t.pos, t.currentTarget.pos) / 7;
            const aimX = t.currentTarget.pos.x + (t.currentTarget.vel.x * tLead);
            const aimY = t.currentTarget.pos.y + (t.currentTarget.vel.y * tLead);
            ctx.strokeStyle = '#ffffff44';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(aimX, aimY, 6, 0, TAU);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(aimX - 8, aimY);
            ctx.lineTo(aimX + 8, aimY);
            ctx.moveTo(aimX, aimY - 8);
            ctx.lineTo(aimX, aimY + 8);
            ctx.stroke();
        }
        
        if (t === selT) {
            for (let j = 0; j < N_LIDAR; j++) {
                const a = t.angle + ((j / N_LIDAR) * TAU);
                const hitDist = raycastWalls(t.pos, a, 160, sim.walls, sim.AW, sim.AH);
                const endX = t.pos.x + (Math.cos(a) * hitDist);
                const endY = t.pos.y + (Math.sin(a) * hitDist);
                const grad = ctx.createLinearGradient(t.pos.x, t.pos.y, endX, endY);
                grad.addColorStop(0, t.color + '88');
                grad.addColorStop(1, t.color + '00');
                ctx.strokeStyle = grad;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(t.pos.x, t.pos.y);
                ctx.lineTo(endX, endY);
                ctx.stroke();
            }
        }
        
        ctx.save();
        ctx.translate(t.pos.x, t.pos.y);
        ctx.rotate(t.angle);
        ctx.fillStyle = '#0a0a12';
        ctx.strokeStyle = t.color;
        ctx.lineWidth = 2;
        ctx.shadowBlur = 10;
        ctx.shadowColor = t.color;
        ctx.beginPath();
        ctx.moveTo(R, 0);
        ctx.lineTo(-R * 0.6, -R * 0.8);
        ctx.lineTo(-R, -R * 0.5);
        ctx.lineTo(-R, R * 0.5);
        ctx.lineTo(-R * 0.6, R * 0.8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.fillStyle = t.color + '44';
        ctx.fillRect(-R * 0.8, -R * 0.4, R * 0.4, R * 0.8);
        ctx.restore();
        
        ctx.save();
        ctx.translate(t.pos.x, t.pos.y);
        ctx.rotate(t.turret);
        ctx.fillStyle = t.color;
        ctx.shadowBlur = 6;
        ctx.shadowColor = t.color;
        ctx.fillRect(0, -3, R + 8, 6);
        ctx.beginPath();
        ctx.arc(0, 0, 7, 0, TAU);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.restore();
        
        const hpw = 32;
        const hpy = t.pos.y - R - 12;
        ctx.fillStyle = '#00000088';
        ctx.fillRect((t.pos.x - (hpw / 2)) - 1, hpy - 1, hpw + 2, 6);
        const hpr = t.hp / t.maxHp;
        
        if (hpr > 0.6) {
            ctx.fillStyle = '#00ff9d';
        } else if (hpr > 0.3) {
            ctx.fillStyle = '#fbbf24';
        } else {
            ctx.fillStyle = '#ff2a2a';
        }
        ctx.fillRect(t.pos.x - (hpw / 2), hpy, hpw * hpr, 4);
        
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(t.name, t.pos.x, t.pos.y + R + 16);
        
        if (t === selT) {
            ctx.strokeStyle = t.color;
            ctx.lineWidth = 1.5;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.arc(t.pos.x, t.pos.y, R + 8, 0, TAU);
            ctx.stroke();
            ctx.setLineDash([]);
        }
    }
    ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════════
   10. UI & MAIN LOOP (FULLY EXPANDED)
═══════════════════════════════════════════════════════════════════════ */

function updateUI() {
    document.getElementById('h-ep').textContent = sim.episode;
    document.getElementById('h-rnd').textContent = sim.round;
    
    if (trainer !== null) {
        document.getElementById('h-train').textContent = trainer.trainSteps;
    } else {
        document.getElementById('h-train').textContent = 0;
    }
    
    document.getElementById('h-buf').textContent = sim.trajectoryBuffer.size();
    
    const trainInd = document.getElementById('train-indicator');
    if (trainInd !== null) {
        if (isTraining) {
            trainInd.className = 'stat-indicator active';
        } else {
            trainInd.className = 'stat-indicator';
        }
    }
    
    let html = '';
    for (let i = 0; i < sim.tanks.length; i++) {
        const t = sim.tanks[i];
        const hp = ((t.hp / t.maxHp) * 100) | 0;
        let hpc = '#ff2a2a';
        if (t.hp / t.maxHp > 0.6) {
            hpc = '#00ff9d';
        } else if (t.hp / t.maxHp > 0.3) {
            hpc = '#fbbf24';
        }
        
        let teamClass = t.team === 'blue' ? 'blue' : 'red';
        let teamText = t.team === 'blue' ? 'СОЮЗ' : 'ВРАГ';
        let selClass = t.id === sim.selected ? 'sel' : '';
        
        let accText = '—';
        if (t.shots > 0) {
            accText = (((t.hits / t.shots) * 100) | 0) + '%';
        }
        
        html += '<div class="tank-card ' + teamClass + ' ' + selClass + '" data-id="' + t.id + '">';
        html += '  <div class="tc-top">';
        html += '    <span class="dot" style="background:' + t.color + '; color:' + t.color + '"></span>';
        html += '    <span class="tc-name">' + t.name + '</span>';
        html += '    <span class="team-tag ' + teamClass + '">' + teamText + '</span>';
        html += '  </div>';
        html += '  <div class="hp-bar"><div class="hp-fill" style="width:' + hp + '%;background:' + hpc + '"></div></div>';
        html += '  <div class="tc-row"><span>K/D</span><b>' + t.kills + '/' + t.deaths + '</b></div>';
        html += '  <div class="tc-row"><span>Урон</span><b>' + (t.damage | 0) + '</b></div>';
        html += '  <div class="tc-row"><span>Точность</span><b>' + accText + '</b></div>';
        html += '</div>';
    }
    
    const tankList = document.getElementById('tank-list');
    if (tankList !== null) {
        tankList.innerHTML = html;
        const cards = tankList.querySelectorAll('.tank-card');
        for (let i = 0; i < cards.length; i++) {
            cards[i].onclick = function() {
                sim.selected = +this.dataset.id;
            };
        }
    }
    
    const t = sim.tanks[sim.selected];
    const panel = document.getElementById('brain-panel');
    if (panel !== null && t !== undefined && t.lastTacticsProbs.length > 0) {
        const probs = t.lastTacticsProbs;
        let policyHtml = '';
        let bestIdx = 0;
        let bestV = -1;
        
        for (let i = 0; i < N_TACTICS; i++) {
            if (probs[i] > bestV) {
                bestV = probs[i];
                bestIdx = i;
            }
        }
        
        for (let i = 0; i < N_TACTICS; i++) {
            const topClass = i === bestIdx ? 'top' : '';
            policyHtml += '<div class="policy-row ' + topClass + '">';
            policyHtml += '  <span class="policy-label">' + TACTICS_NAMES[i] + '</span>';
            policyHtml += '  <div class="policy-bar"><div class="policy-fill" style="width:' + (probs[i] * 100) + '%;background:' + t.color + '"></div></div>';
            policyHtml += '  <span class="policy-val">' + (probs[i] * 100).toFixed(1) + '%</span>';
            policyHtml += '</div>';
        }
        
        let targetHtml = '<div style="color:var(--text-dim);font-size:9px">Нет целей</div>';
        if (t.lastTargetScores !== undefined) {
            const enemies = [];
            for (let i = 0; i < sim.tanks.length; i++) {
                const tt = sim.tanks[i];
                if (tt.alive && tt.team !== t.team) {
                    enemies.push({ e: tt, d: dist(t.pos, tt.pos) });
                }
            }
            enemies.sort(function(a, b) {
                return a.d - b.d;
            });
            
            let rows = '';
            for (let k = 0; k < MAX_ENEMIES; k++) {
                if (k >= enemies.length) {
                    break;
                }
                const sc = t.lastTargetScores[k];
                const e = enemies[k].e;
                const sel = k === t.lastTargetIdx ? 'top' : '';
                
                const width = clamp((sc * 30) + 50, 0, 100);
                rows += '<div class="policy-row ' + sel + '">';
                rows += '  <span class="policy-label" style="color:' + e.color + '">' + e.name + '</span>';
                rows += '  <div class="policy-bar"><div class="policy-fill" style="width:' + width + '%;background:' + e.color + '"></div></div>';
                rows += '  <span class="policy-val">' + sc.toFixed(2) + '</span>';
                rows += '</div>';
            }
            if (rows !== '') {
                targetHtml = rows;
            }
        }
        
        panel.innerHTML = 
            '<div class="bp-section">' +
            '  <div class="bp-title">Тактическое решение</div>' +
            policyHtml +
            '</div>' +
            '<div class="bp-section">' +
            '  <div class="bp-title">Приоритет целей</div>' +
            targetHtml +
            '</div>' +
            '<div class="bp-section">' +
            '  <div class="bp-title">Оценка состояния V(s)</div>' +
            '  <div style="color:var(--accent-green); font-size:14px; font-weight:700">' + t.lastValue.toFixed(3) + '</div>' +
            '</div>';
    }
    
    if (trainer !== null) {
        const m = trainer.lastMetrics;
        const metricsEl = document.getElementById('metrics');
        if (metricsEl !== null) {
            metricsEl.innerHTML = 
                '<div class="tc-row"><span>Policy Loss</span><b>' + m.policyLoss.toFixed(4) + '</b></div>' +
                '<div class="tc-row"><span>Value Loss</span><b>' + m.valueLoss.toFixed(4) + '</b></div>' +
                '<div class="tc-row"><span>Entropy</span><b>' + m.entropy.toFixed(4) + '</b></div>' +
                '<div class="tc-row"><span>Buffer Size</span><b>' + sim.trajectoryBuffer.size() + '</b></div>';
        }
    }
    
    const logEl = document.getElementById('log');
    if (logEl !== null) {
        let logHtml = '';
        const slice = sim.log.slice(0, 25);
        for (let i = 0; i < slice.length; i++) {
            const e = slice[i];
            const tickStr = e.t.toString().padStart(4, '0');
            logHtml += '<div class="' + e.cls + '">[' + tickStr + '] ' + e.msg + '</div>';
        }
        logEl.innerHTML = logHtml;
    }
}

let fps = 0;
let frames = 0;
let lastFps = performance.now();
let uiCounter = 0; // FIX #4: Счётчик для предотвращения мерцания

function loop(timestamp) {
    requestAnimationFrame(loop);
    
    if (sim.running) {
        const dt = 1 / 60;
        sim.accumulator = sim.accumulator + (dt * sim.speed);
        while (sim.accumulator >= dt) {
            stepPhysics();
            sim.accumulator = sim.accumulator - dt;
        }
        
        if (!isTraining && sim.trajectoryBuffer.size() > 300) {
            isTraining = true;
            trainer.trainStepAsync(sim.trajectoryBuffer, 12).then(function() {
                isTraining = false;
            });
        }
    }
    
    render();
    frames = frames + 1;
    
    const now = performance.now();
    if (now - lastFps >= 1000) {
        fps = frames;
        frames = 0;
        lastFps = now;
        const el = document.getElementById('h-fps');
        if (el !== null) {
            el.textContent = fps;
            if (fps >= 55) {
                el.style.color = 'var(--accent-green)';
            } else if (fps >= 30) {
                el.style.color = '#fbbf24';
            } else {
                el.style.color = 'var(--accent-red)';
            }
        }
    }
    
    // FIX #4: Инкрементальный счётчик вместо Math.floor(timestamp / 100)
    uiCounter = uiCounter + 1;
    if (uiCounter % 6 === 0) {
        updateUI();
    }
}

function setupControls() {
    const btnGo = document.getElementById('btn-go');
    if (btnGo !== null) {
        btnGo.onclick = function() {
            sim.running = !sim.running;
            if (sim.running) {
                this.textContent = '⏸ PAUSE';
                this.classList.remove('primary');
            } else {
                this.textContent = '▶ START';
                this.classList.add('primary');
            }
        };
    }
    
    const btnTrain = document.getElementById('btn-train');
    if (btnTrain !== null) {
        btnTrain.onclick = async function() {
            if (isTraining) {
                return;
            }
            if (sim.trajectoryBuffer.size() < 200) {
                alert('Недостаточно данных в буфере.');
                return;
            }
            isTraining = true;
            addLog('🧠 Запуск форсированного обучения...', 'log-l');
            for (let i = 0; i < 10; i++) {
                await trainer.trainStepAsync(sim.trajectoryBuffer, 50);
            }
            isTraining = false;
            updateUI();
        };
    }
    
    const btnRst = document.getElementById('btn-rst');
    if (btnRst !== null) {
        btnRst.onclick = function() {
            sim.running = false;
            sim.round = 1;
            sim.episode = 0;
            sim.tick = 0;
            sim.log = [];
            sim.trajectoryBuffer.clear();
            sim.accumulator = 0;
            isTraining = false;
            initBrain();
            initRound();
            const btn = document.getElementById('btn-go');
            if (btn !== null) {
                btn.textContent = '▶ START';
                btn.classList.add('primary');
            }
            updateUI();
        };
    }
    
    const selSpd = document.getElementById('sel-spd');
    if (selSpd !== null) {
        selSpd.onchange = function(e) {
            sim.speed = +e.target.value;
        };
    }
    
    if (canvas !== null) {
        canvas.addEventListener('click', function(e) {
            const r = canvas.getBoundingClientRect();
            const scale = Math.min(canvas.width / sim.AW, canvas.height / sim.AH) * 0.92;
            const ox = (canvas.width - (sim.AW * scale)) / 2;
            const oy = (canvas.height - (sim.AH * scale)) / 2;
            const x = (((e.clientX - r.left) * dpr) - ox) / scale;
            const y = (((e.clientY - r.top) * dpr) - oy) / scale;
            
            let best = null;
            let bd = 40;
            for (let i = 0; i < sim.tanks.length; i++) {
                const t = sim.tanks[i];
                const d = dist(t.pos, {x: x, y: y});
                if (d < bd) {
                    bd = d;
                    best = t;
                }
            }
            if (best !== null) {
                sim.selected = best.id;
            }
        });
    }
}

window.addEventListener('DOMContentLoaded', function() {
    initRender();
    initBrain();
    initRound();
    setupControls();
    updateUI();
    requestAnimationFrame(loop);
});
</script>
