<!DOCTYPE html>

<style>
:root {
    --bg-deep: #050508;
    --bg-panel: #0a0a12;
    --border: #1a1a2e;
    --text-main: #e0e0e0;
    --text-dim: #6b7280;
    --accent-blue: #00f0ff;
    --accent-red: #ff2a2a;
    --accent-green: #00ff9d;
    --accent-purple: #a855f7;
    --font-mono: 'SF Mono', 'Fira Code', monospace;
    --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg-deep);
    color: var(--text-main);
    font-family: var(--font-ui);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
}

#app {
    display: grid;
    grid-template-columns: 1fr 360px;
    grid-template-rows: 56px 1fr;
    height: 100%;
    background: var(--bg-deep);
}

header {
    grid-column: 1 / 3;
    background: var(--bg-panel);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 20px;
    border-bottom: 1px solid var(--border);
    z-index: 10;
}

h1 {
    font-size: 14px;
    color: var(--accent-blue);
    letter-spacing: 2px;
    font-weight: 800;
    text-transform: uppercase;
}

.stat {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 4px;
}

.stat b {
    color: var(--text-main);
    font-family: var(--font-mono);
    font-weight: 600;
}

.stat-indicator {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #333;
}

.stat-indicator.active {
    background: var(--accent-purple);
    box-shadow: 0 0 8px var(--accent-purple);
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.4; }
    100% { opacity: 1; }
}

.spacer {
    flex: 1;
}

.controls {
    display: flex;
    gap: 8px;
    align-items: center;
}

button, select {
    background: #11111a;
    border: 1px solid var(--border);
    color: var(--text-main);
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.2s ease;
    font-family: var(--font-ui);
}

button:hover:not(:disabled) {
    border-color: var(--accent-blue);
    color: var(--accent-blue);
}

button.primary {
    background: var(--accent-blue);
    border-color: var(--accent-blue);
    color: #000;
}

button.primary:hover:not(:disabled) {
    background: #33f3ff;
    box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
}

button.danger {
    border-color: var(--accent-red);
    color: var(--accent-red);
}

button.danger:hover:not(:disabled) {
    background: rgba(255, 42, 42, 0.1);
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
    border-color: #333;
    color: #666;
}

#arena-wrap {
    position: relative;
    background: radial-gradient(circle at center, #0a0a14 0%, #050508 100%);
    overflow: hidden;
    border-right: 1px solid var(--border);
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
    image-rendering: high-quality;
}

#side {
    background: var(--bg-panel);
    padding: 16px;
    overflow-y: auto;
    font-size: 11px;
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.ptitle {
    font-size: 10px;

    letter-spacing: 1.5px;
    color: var(--text-dim);
    font-weight: 700;

}

}

    border-color: var(--accent-blue);

}

    border-color: var(--accent-red);
    background: rgba(255, 42, 42, 0.05);

.tc-top {

.hp-bar {

}

.hp-fill {
    height: 100%;

}

.tc-row {
    display: flex;
    justify-content: space-between;
    color: var(--text-dim);
    font-size: 10px;
    line-height: 1.8;
}

.tc-row b {
    color: var(--text-main);

#brain-panel {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px;
    font-family: var(--font-mono);
    font-size: 10px;
}

.bp-section {
    margin-bottom: 12px;
}

.bp-section:last-child {
    margin-bottom: 0;
}

.bp-title {
    color: var(--text-dim);
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 6px;
    font-weight: 700;
}

.policy-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 3px 0;
}

.policy-label {
    width: 80px;
    color: #9ca3af;
    font-size: 9px;
    flex-shrink: 0;
}

.policy-bar {
    flex: 1;
    height: 6px;
    background: #1a1a2e;
    border-radius: 3px;

}

.policy-fill {

}

.policy-val {
    width: 40px;

.policy-row.top .policy-fill {
    background: var(--accent-green);
    box-shadow: 0 0 6px rgba(0, 255, 157, 0.4);
}

.policy-row.top .policy-label {
    color: var(--accent-green);

#log {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--text-dim);
    max-height: 160px;
    overflow-y: auto;
    line-height: 1.6;
    background: rgba(0, 0, 0, 0.2);
    padding: 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
}

.log-k { color: var(--accent-red); }
.log-w { color: var(--accent-green); }
.log-s { color: var(--accent-blue); }
.log-l { color: var(--accent-purple); }

#metrics {
    background: rgba(0, 0, 0, 0.3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    font-size: 10px;
    color: #9ca3af;
    font-family: var(--font-mono);
}

::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 3px; }
</style>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════════════
   1. CORE MATH & PHYSICS ENGINE (FULLY EXPANDED)
═══════════════════════════════════════════════════════════════════════ */

function clamp(value, min, max) {
    if (value < min) {
        return min;
    }
    if (value > max) {
        return max;
    }
    return value;
}

function dist(a, b) {
    return Math.hypot(a.x - b.x, a.y - b.y);
}

function normAng(a) {
    a = a % (Math.PI * 2);
    if (a > Math.PI) {
        a = a - (Math.PI * 2);
    }
    if (a < -Math.PI) {
        a = a + (Math.PI * 2);
    }
    return a;
}

function angDiff(a, b) {
    return normAng(a - b);
}

const TAU = Math.PI * 2;
const EPS = 1e-8;

class Vector2 {
    constructor(x, y) {
        this.x = x !== undefined ? x : 0;
        this.y = y !== undefined ? y : 0;
    }

    add(v) {
        this.x = this.x + v.x;
        this.y = this.y + v.y;
        return this;
    }

    mult(s) {
        this.x = this.x * s;
        this.y = this.y * s;
        return this;
    }

    mag() {
        return Math.hypot(this.x, this.y);
    }

    normalize() {
        const m = this.mag();
        if (m > 0) {
            this.mult(1 / m);
        }
        return this;
    }
}

class SeededRNG {
    constructor(seed) {
        this.state = (seed >>> 0) || 1;
    }

    fork(extraSeed) {
        const newState = (this.state * 0x9E3779B1) ^ (extraSeed >>> 0);
        return new SeededRNG(newState);
    }

    next() {
        let t = this.state + 0x6D2B79F5;
        this.state = t;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t = t ^ (t + Math.imul(t ^ (t >>> 7), t | 61));
        this.state = (t ^ (t >>> 14)) >>> 0;
        return this.state / 4294967296;
    }

    gaussian(mean, std) {
        const m = mean !== undefined ? mean : 0;
        const s = std !== undefined ? std : 1;
        const u1 = Math.max(this.next(), EPS);
        const u2 = this.next();
        const mag = Math.sqrt(-2 * Math.log(u1));
        const cos = Math.cos(TAU * u2);
        return mag * cos * s + m;
    }
}

/* ═══════════════════════════════════════════════════════════════════════
   2. NEURAL NETWORK LAYERS (FULLY EXPANDED)
═══════════════════════════════════════════════════════════════════════ */

class Linear {
    constructor(inF, outF, rng, scale) {
        this.inF = inF;
        this.outF = outF;
        this.W = new Float32Array(outF * inF);
        this.b = new Float32Array(outF);
        this.velW = new Float32Array(outF * inF);
        this.velB = new Float32Array(outF);
        
        const s = scale !== null && scale !== undefined ? scale : Math.sqrt(2 / inF);
        for (let i = 0; i < this.W.length; i++) {
            this.W[i] = (this.nextRandom(rng) * 2 - 1) * s;
        }
        
        this.dW = new Float32Array(outF * inF);
        this.db = new Float32Array(outF);
        this.lastIn = null;
    }

    nextRandom(rng) {
        return rng.next();
    }

    forward(x) {
        this.lastIn = x;
        const out = new Float32Array(this.outF);
        const W = this.W;
        const b = this.b;
        const inF = this.inF;
        const outF = this.outF;
        
        for (let o = 0; o < outF; o++) {
            let s = b[o];
            const row = o * inF;
            for (let i = 0; i < inF; i++) {
                s = s + (W[row + i] * x[i]);
            }
            out[o] = s;
        }
        return out;
    }

    backward(dOut) {
        const x = this.lastIn;
        const inF = this.inF;
        const outF = this.outF;
        const W = this.W;
        const dW = this.dW;
        const db = this.db;
        const dIn = new Float32Array(inF);
        
        for (let o = 0; o < outF; o++) {
            const dout = dOut[o];
            db[o] = db[o] + dout;
            const row = o * inF;
            for (let i = 0; i < inF; i++) {
                dW[row + i] = dW[row + i] + (dout * x[i]);
                dIn[i] = dIn[i] + (dout * W[row + i]);
            }
        }
        return dIn;
    }

    apply(lr, momentum, clipVal) {
        const m = momentum !== undefined ? momentum : 0.9;
        const c = clipVal !== undefined ? clipVal : 5;
        const W = this.W;
        const b = this.b;
        const dW = this.dW;
        const db = this.db;
        const velW = this.velW;
        const velB = this.velB;
        
        let gn = 0;
        for (let i = 0; i < dW.length; i++) {
            gn = gn + (dW[i] * dW[i]);
        }
        for (let i = 0; i < db.length; i++) {
            gn = gn + (db[i] * db[i]);
        }
        gn = Math.sqrt(gn);
        
        const scale = gn > c ? c / gn : 1;
        
        for (let i = 0; i < W.length; i++) {
            velW[i] = (m * velW[i]) + (dW[i] * scale);
            W[i] = W[i] + (lr * velW[i]);
            dW[i] = 0;
        }
        for (let i = 0; i < b.length; i++) {
            velB[i] = (m * velB[i]) + (db[i] * scale);
            b[i] = b[i] + (lr * velB[i]);
            db[i] = 0;
        }
    }

    zeroGrad() {
        this.dW.fill(0);
        this.db.fill(0);
    }
}

function reluForward(x) {
    const o = new Float32Array(x.length);
    for (let i = 0; i < x.length; i++) {
        if (x[i] > 0) {
            o[i] = x[i];
        } else {
            o[i] = 0;
        }
    }
    return o;
}

function reluBackward(preAct, dOut) {
    const o = new Float32Array(preAct.length);
    for (let i = 0; i < preAct.length; i++) {
        if (preAct[i] > 0) {
            o[i] = dOut[i];
        } else {
            o[i] = 0;
        }
    }
    return o;
}

function softmax(x) {
    let max = -Infinity;
    for (let i = 0; i < x.length; i++) {
        if (x[i] > max) {
            max = x[i];
        }
    }
    const o = new Float32Array(x.length);
    let s = 0;
    for (let i = 0; i < x.length; i++) {
        o[i] = Math.exp(x[i] - max);
        s = s + o[i];
    }
    for (let i = 0; i < x.length; i++) {
        o[i] = o[i] / s;
    }
    return o;
}

/* ═══════════════════════════════════════════════════════════════════════
   3. SENSOR & ENVIRONMENT (FULLY EXPANDED)
═══════════════════════════════════════════════════════════════════════ */

const MAX_ENEMIES = 4;
const MAX_ENEMY_FEATURES = 8;
const N_LIDAR = 8;
const SENSOR_DIM = 52;
const SELF_OFF = 0;
const ENEMY_OFF = 6;
const LIDAR_OFF = ENEMY_OFF + (MAX_ENEMIES * MAX_ENEMY_FEATURES);
const BULLET_OFF = LIDAR_OFF + N_LIDAR;
const META_OFF = BULLET_OFF + 3;

function buildSensors(tank, tanks, bullets, walls, AW, AH) {
    const s = new Float32Array(SENSOR_DIM);
    s[SELF_OFF + 0] = (tank.pos.x / AW) * 2 - 1;
    s[SELF_OFF + 1] = (tank.pos.y / AH) * 2 - 1;
    s[SELF_OFF + 2] = tank.hp / tank.maxHp;
    
    if (tank.reload <= 0) {
        s[SELF_OFF + 3] = 1;
    } else {
        s[SELF_OFF + 3] = tank.reload / tank.reloadTime;
    }
    
    s[SELF_OFF + 4] = Math.cos(tank.angle);
    s[SELF_OFF + 5] = Math.sin(tank.angle);

    const enemies = [];
    for (let i = 0; i < tanks.length; i++) {
        const t = tanks[i];
        if (t.alive && t.team !== tank.team) {
            enemies.push(t);
        }
    }
    
    const sorted = [];
    for (let i = 0; i < enemies.length; i++) {
        sorted.push({ e: enemies[i], d: dist(tank.pos, enemies[i].pos) });
    }
    sorted.sort(function(a, b) {
        return a.d - b.d;
    });
    
    const maxD = Math.hypot(AW, AH);

    for (let k = 0; k < MAX_ENEMIES; k++) {
        const off = ENEMY_OFF + (k * MAX_ENEMY_FEATURES);
        const rec = sorted[k];
        if (rec !== undefined) {
            const e = rec.e;
            s[off + 0] = (e.pos.x - tank.pos.x) / maxD;
            s[off + 1] = (e.pos.y - tank.pos.y) / maxD;
            
            // FIX #1 (Sensor logic): Информативный признак вместо константы
            if (e.currentTarget !== null && e.currentTarget.id === tank.id) {
                s[off + 2] = 1.0;
            } else {
                s[off + 2] = 0.0;
            }
            
            s[off + 3] = clamp(rec.d / maxD, 0, 1);
            s[off + 4] = clamp(e.vel.x / 3, -1, 1);
            s[off + 5] = clamp(e.vel.y / 3, -1, 1);
            s[off + 6] = e.hp / e.maxHp;
            
            const aimAtMe = Math.atan2(tank.pos.y - e.pos.y, tank.pos.x - e.pos.x);
            const diff = Math.abs(angDiff(e.turret, aimAtMe));
            s[off + 7] = clamp(1 - (diff / (Math.PI / 2)), 0, 1);
        }
    }

    for (let i = 0; i < N_LIDAR; i++) {
        const a = tank.angle + ((i / N_LIDAR) * TAU);
        const hit = raycastWalls(tank.pos, a, 160, walls, AW, AH);
        s[LIDAR_OFF + i] = clamp(hit / 160, 0, 1);
    }

    let threat = 0;
    let dodgeX = 0;
    let dodgeY = 0;
    
    for (let i = 0; i < bullets.length; i++) {
        const b = bullets[i];
        if (b.team === tank.team) {
            continue;
        }
        const d = dist(b.pos, tank.pos);
        if (d > 180) {
            continue;
        }
        const toMeX = tank.pos.x - b.pos.x;
        const toMeY = tank.pos.y - b.pos.y;
        const dot = (toMeX * b.vel.x) + (toMeY * b.vel.y);
        
        if (dot > 0) {
            const t = clamp(1 - (d / 180), 0, 1);
            if (t > threat) {
                threat = t;
                const bl = Math.hypot(b.vel.x, b.vel.y) || 1;
                let dx = -b.vel.y / bl;
                let dy = b.vel.x / bl;
                const side = (toMeX * dx) + (toMeY * dy);
                if (side < 0) {
                    dx = -dx;
                    dy = -dy;
                }
                dodgeX = dx;
                dodgeY = dy;
            }
        }
    }
    
    s[BULLET_OFF + 0] = threat;
    s[BULLET_OFF + 1] = dodgeX;
    s[BULLET_OFF + 2] = dodgeY;
    s[META_OFF + 0] = clamp(nearestWallDist(tank.pos, walls) / 80, 0, 1);
    s[META_OFF + 1] = clamp(enemies.length / 6, 0, 1);
    
    if (tank.recentDamage > 0) {
        s[META_OFF + 2] = clamp(tank.recentDamage / 30, 0, 1);
    } else {
        s[META_OFF + 2] = 0;
    }
    
    return s;
}

function raycastWalls(pos, ang, maxD, walls, AW, AH) {
    const step = 6;
    const dx = Math.cos(ang);
    const dy = Math.sin(ang);
    for (let d = step; d <= maxD; d = d + step) {
        const x = pos.x + (dx * d);
        const y = pos.y + (dy * d);
        if (x < 0 || x > AW || y < 0 || y > AH) {
            return d;
        }
        for (let i = 0; i < walls.length; i++) {
            const w = walls[i];
            if (x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h) {
                return d;
            }
        }
    }
    return maxD;
}

function nearestWallDist(pos, walls) {
    let best = 1e9;
    for (let i = 0; i < walls.length; i++) {
        const w = walls[i];
        const cx = clamp(pos.x, w.x, w.x + w.w);
        const cy = clamp(pos.y, w.y, w.y + w.h);
        const d = Math.hypot(pos.x - cx, pos.y - cy);
        if (d < best) {
            best = d;
        }
    }
    return best;
}

function pointInWall(x, y, walls) {
    for (let i = 0; i < walls.length; i++) {
        const w = walls[i];
        if (x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h) {
            return true;
        }
    }
    return false;
}

/* ═══════════════════════════════════════════════════════════════════════
   4. POLICY NETWORK (FULLY EXPANDED)
═══════════════════════════════════════════════════════════════════════ */

const EMBED_DIM = 64;

class Encoder {
    constructor(rng) {
        this.fc1 = new Linear(SENSOR_DIM, 96, rng);
        this.fc2 = new Linear(96, EMBED_DIM, rng);
        this.lastPreAct1 = null;
        this.lastPreAct2 = null;
    }

    forward(x) {
        const h1_pre = this.fc1.forward(x);
        this.lastPreAct1 = h1_pre;
        const h1 = reluForward(h1_pre);
        const h2_pre = this.fc2.forward(h1);
        this.lastPreAct2 = h2_pre;
        return reluForward(h2_pre);
    }

    backward(dOut) {
        const dh2 = reluBackward(this.lastPreAct2, dOut);
        const dh1 = this.fc2.backward(dh2);
        const dh1_act = reluBackward(this.lastPreAct1, dh1);
        return this.fc1.backward(dh1_act);
    }

    getLayers() {
        return [this.fc1, this.fc2];
    }
}

const TACTICS_NAMES = ['АТАКА', 'ФЛАНГ-Л', 'ФЛАНГ-П', 'ДИСТАНЦИЯ', 'УКЛОН', 'ОТСТУП', 'УКРЫТИЕ', 'ПАТРУЛЬ'];
const N_TACTICS = 8;
const LOW_DIM = 5;

class PolicyNet {
    constructor(rng) {
        this.encoder = new Encoder(rng);
        this.policyFC = new Linear(EMBED_DIM, 96, rng);
        this.tacticsHead = new Linear(96, N_TACTICS, rng, 0.01);
        this.targetHead = new Linear(96 + MAX_ENEMY_FEATURES, 1, rng, 0.01);
        this.lowMeanHead = new Linear(96, LOW_DIM, rng, 0.01);
        this.lowLogStdHead = new Linear(96, LOW_DIM, rng, 0.01);
        for (let i = 0; i < LOW_DIM; i++) {
            this.lowLogStdHead.b[i] = 0;
        }
        this.valueHead = new Linear(96, 1, rng, 0.01);
        this.lastH = null;
        this.lastPreActPolicy = null;
    }

    forward(sensors, rng) {
        const emb = this.encoder.forward(sensors);
        const h_pre = this.policyFC.forward(emb);
        this.lastPreActPolicy = h_pre;
        const h = reluForward(h_pre);
        this.lastH = h;
        
        const tacticsLogits = this.tacticsHead.forward(h);
        const tacticsProbs = softmax(tacticsLogits);
        
        let r = rng.next();
        let cum = 0;
        let tactic = 0;
        for (let i = 0; i < N_TACTICS; i++) {
            cum = cum + tacticsProbs[i];
            if (r <= cum) {
                tactic = i;
                break;
            }
        }
        
        const enemyFeatures = [];
        const targetScores = new Float32Array(MAX_ENEMIES);
        let validCount = 0;
        
        for (let k = 0; k < MAX_ENEMIES; k++) {
            const off = ENEMY_OFF + (k * MAX_ENEMY_FEATURES);
            if (sensors[off + 0] === 0 && sensors[off + 1] === 0 && sensors[off + 3] === 0) {
                targetScores[k] = -100;
                enemyFeatures.push(null);
                continue;
            }
            const features = new Float32Array(MAX_ENEMY_FEATURES);
            for (let i = 0; i < MAX_ENEMY_FEATURES; i++) {
                features[i] = sensors[off + i];
            }
            enemyFeatures.push(features);
            
            const concat = new Float32Array(96 + MAX_ENEMY_FEATURES);
            for (let i = 0; i < 96; i++) {
                concat[i] = h[i];
            }
            for (let i = 0; i < MAX_ENEMY_FEATURES; i++) {
                concat[96 + i] = features[i];
            }
            targetScores[k] = this.targetHead.forward(concat)[0];
            validCount = validCount + 1;
        }
        
        const targetProbs = new Float32Array(MAX_ENEMIES);
        if (validCount > 0) {
            let maxS = -Infinity;
            for (let k = 0; k < MAX_ENEMIES; k++) {
                if (targetScores[k] > maxS) {
                    maxS = targetScores[k];
                }
            }
            let sum = 0;
            for (let k = 0; k < MAX_ENEMIES; k++) {
                if (targetScores[k] > -50) {
                    targetProbs[k] = Math.exp(targetScores[k] - maxS);
                    sum = sum + targetProbs[k];
                }
            }
            if (sum > EPS) {
                for (let k = 0; k < MAX_ENEMIES; k++) {
                    targetProbs[k] = targetProbs[k] / sum;
                }
            }
        }
        
        let targetIdx = 0;
        r = rng.next();
        cum = 0;
        for (let k = 0; k < MAX_ENEMIES; k++) {
            cum = cum + targetProbs[k];
            if (r <= cum) {
                targetIdx = k;
                break;
            }
        }
        
        const lowMean = this.lowMeanHead.forward(h);
        const lowLogStd = this.lowLogStdHead.forward(h);
        const action = new Float32Array(LOW_DIM);
        const actionSamples = new Float32Array(LOW_DIM);
        let lowLogProb = 0;
        
        for (let i = 0; i < LOW_DIM; i++) {
            const std = Math.exp(clamp(lowLogStd[i], -5, 2));
            const sample = rng.gaussian(lowMean[i], std);
            actionSamples[i] = sample;
            action[i] = Math.tanh(sample);
            const z = (sample - lowMean[i]) / std;
            const logP = -0.5 * Math.log(2 * Math.PI) - lowLogStd[i] - 0.5 * (z * z);
            const correction = Math.log(1 - (action[i] * action[i]) + EPS);
            lowLogProb = lowLogProb + logP - correction;
        }
        
        const value = this.valueHead.forward(h)[0];
        
        return {
            tactic: tactic,
            action: action,
            value: value,
            tacticsProbs: tacticsProbs,
            targetIdx: targetIdx,
            targetScores: targetScores,
            targetProbs: targetProbs,
            enemyFeatures: enemyFeatures,
            validCount: validCount,
            lowLogProb: lowLogProb,
            lowMean: lowMean,
            lowLogStd: lowLogStd,
            actionSamples: actionSamples
        };
    }

    forwardValue(sensors) {
        const layers = [this.encoder.fc1, this.encoder.fc2, this.policyFC, this.valueHead];
        const saved = [];
        for (let i = 0; i < layers.length; i++) {
            saved.push(layers[i].lastIn);
        }
        
        let x = reluForward(this.encoder.fc1.forward(sensors));
        x = reluForward(this.encoder.fc2.forward(x));
        x = reluForward(this.policyFC.forward(x));
        const v = this.valueHead.forward(x)[0];
        
        for (let i = 0; i < layers.length; i++) {
            layers[i].lastIn = saved[i];
        }
        return v;
    }

    getLayers() {
        const encLayers = this.encoder.getLayers();
        return [
            encLayers[0],
            encLayers[1],
            this.policyFC,
            this.tacticsHead,
            this.targetHead,
            this.lowMeanHead,
            this.lowLogStdHead,
            this.valueHead
        ];
    }
}

/* ═══════════════════════════════════════════════════════════════════════
   5. TRAJECTORY BUFFER & PPO TRAINER (FULLY EXPANDED)
═══════════════════════════════════════════════════════════════════════ */

class TrajectoryBuffer {
    constructor(maxEpisodes) {
        this.maxEpisodes = maxEpisodes !== undefined ? maxEpisodes : 40;
        this.episodes = [];
    }

    addEpisode(transitions, bootstrapValue) {
        const bv = bootstrapValue !== undefined ? bootstrapValue : 0;
        if (transitions.length === 0) {
            return;
        }
        this.episodes.push({ transitions: transitions, bootstrapValue: bv });
        while (this.episodes.length > this.maxEpisodes) {
            this.episodes.shift();
        }
    }

    sample(n) {
        if (this.episodes.length === 0) {
            return [];
        }
        const out = [];
        for (let i = 0; i < n; i++) {
            const idx = (Math.random() * this.episodes.length) | 0;
            out.push(this.episodes[idx]);
        }
        return out;
    }

    size() {
        let s = 0;
        for (let i = 0; i < this.episodes.length; i++) {
            s = s + this.episodes[i].transitions.length;
        }
        return s;
    }

    clear() {
        this.episodes = [];
    }
}

class PPOTrainer {
    constructor(policy, lr) {
        this.policy = policy;
        this.lr = lr !== undefined ? lr : 0.0004;
        this.gamma = 0.995;
        this.lambda = 0.95;
        this.clipEps = 0.2;
        this.entropyCoef = 0.015;
        this.valueCoef = 0.5;
        this.epochs = 4;
        this.batchSize = 64;
        this.trainSteps = 0;
        this.lastMetrics = { policyLoss: 0, valueLoss: 0, entropy: 0, targetLoss: 0 };
    }

    computeGAE(transitions, bootstrapValue) {
        const T = transitions.length;
        const advantages = new Float32Array(T);
        const returns = new Float32Array(T);
        let gae = 0;
        let nextV = bootstrapValue;
        
        for (let t = T - 1; t >= 0; t--) {
            const delta = transitions[t].reward + (this.gamma * nextV) - transitions[t].value;
            gae = delta + (this.gamma * this.lambda * gae);
            advantages[t] = gae;
            returns[t] = gae + transitions[t].value;
            nextV = transitions[t].value;
        }
        return { advantages: advantages, returns: returns };
    }

    trainStepAsync(buffer, maxTimeMs) {
        const mTime = maxTimeMs !== undefined ? maxTimeMs : 16;
        const self = this;
        
        return new Promise(function(resolve) {
            const startTime = performance.now();
            const sampled = buffer.sample(8);
            
            // FIX: Deep copy to prevent race conditions with buffer shifts
            const episodes = [];
            for (let i = 0; i < sampled.length; i++) {
                episodes.push({
                    transitions: sampled[i].transitions,
                    bootstrapValue: sampled[i].bootstrapValue
                });
            }
            
            if (episodes.length === 0) {
                resolve(self.lastMetrics);
                return;
            }
            
            const all = [];
            for (let i = 0; i < episodes.length; i++) {
                const ep = episodes[i];
                const gaeRes = self.computeGAE(ep.transitions, ep.bootstrapValue);
                const advantages = gaeRes.advantages;
                const returns = gaeRes.returns;
                for (let t = 0; t < ep.transitions.length; t++) {
                    all.push({
                        state: ep.transitions[t].state,
                        tactic: ep.transitions[t].tactic,
                        value: ep.transitions[t].value,
                        tacticsProbs: ep.transitions[t].tacticsProbs,
                        action: ep.transitions[t].action,
                        actionSamples: ep.transitions[t].actionSamples,
                        lowLogProb: ep.transitions[t].lowLogProb,
                        targetIdx: ep.transitions[t].targetIdx,
                        targetScores: ep.transitions[t].targetScores,
                        targetProbs: ep.transitions[t].targetProbs,
                        validCount: ep.transitions[t].validCount,
                        enemyFeatures: ep.transitions[t].enemyFeatures,
                        reward: ep.transitions[t].reward,
                        tick: ep.transitions[t].tick,
                        advantage: advantages[t],
                        return_: returns[t]
                    });
                }
            }
            
            let amean = 0;
            for (let i = 0; i < all.length; i++) {
                amean = amean + all[i].advantage;
            }
            amean = amean / all.length;
            
            let avar = 0;
            for (let i = 0; i < all.length; i++) {
                const d = all[i].advantage - amean;
                avar = avar + (d * d);
            }
            const astdev = Math.sqrt((avar / all.length) + EPS);
            
            for (let i = 0; i < all.length; i++) {
                all[i].advantage = (all[i].advantage - amean) / astdev;
            }
            
            let tPL = 0;
            let tVL = 0;
            let tEnt = 0;
            let tTL = 0;
            let count = 0;
            let epoch = 0;
            let start = 0;
            
            function processBatch() {
                if (performance.now() - startTime > mTime || epoch >= self.epochs) {
                    self.lastMetrics = {
                        policyLoss: count > 0 ? tPL / count : 0,
                        valueLoss: count > 0 ? tVL / count : 0,
                        entropy: count > 0 ? tEnt / count : 0,
                        targetLoss: count > 0 ? tTL / count : 0
                    };
                    resolve(self.lastMetrics);
                    return;
                }
                
                if (start >= all.length) {
                    epoch = epoch + 1;
                    start = 0;
                    for (let i = all.length - 1; i > 0; i--) {
                        const j = (Math.random() * (i + 1)) | 0;
                        const temp = all[i];
                        all[i] = all[j];
                        all[j] = temp;
                    }
                }
                
                const end = Math.min(start + self.batchSize, all.length);
                const batch = all.slice(start, end);
                start = end;
                
                if (batch.length >= 4) {
                    const layers = self.policy.getLayers();
                    for (let i = 0; i < layers.length; i++) {
                        layers[i].zeroGrad();
                    }
                    
                    for (let i = 0; i < batch.length; i++) {
                        const m = self._trainOne(batch[i]);
                        tPL = tPL + m.policy;
                        tVL = tVL + m.value;
                        tEnt = tEnt + m.entropy;
                        tTL = tTL + m.target;
                        count = count + 1;
                    }
                    
                    for (let i = 0; i < layers.length; i++) {
                        layers[i].apply(self.lr, 0.9, 5);
                    }
                    self.trainSteps = self.trainSteps + 1;
                }
                
                setTimeout(processBatch, 0);
            }
            
            processBatch();
        });
    }

    _trainOne(ex) {
        const p = this.policy;
        const emb = p.encoder.forward(ex.state);
        const h_pre = p.policyFC.forward(emb);
        const h = reluForward(h_pre);
        p.lastH = h;
        p.lastPreActPolicy = h_pre;
        const adv = ex.advantage;
        
        // TACTICS
        const tacticsLogits = p.tacticsHead.forward(h);
        const newTacticsProbs = softmax(tacticsLogits);
        const oldProb = ex.tacticsProbs[ex.tactic];
        const ratio = newTacticsProbs[ex.tactic] / Math.max(oldProb, EPS);
        const clippedRatio = clamp(ratio, 1 - this.clipEps, 1 + this.clipEps);
        const policyLoss = -Math.min(ratio * adv, clippedRatio * adv);
        const isTacticsClipped = (ratio < 1 - this.clipEps && adv > 0) || (ratio > 1 + this.clipEps && adv < 0);
        
        const dLogits = new Float32Array(N_TACTICS);
        if (!isTacticsClipped) {
            for (let j = 0; j < N_TACTICS; j++) {
                const indicator = (ex.tactic === j) ? 1 : 0;
                const dp_dlogit = newTacticsProbs[ex.tactic] * (indicator - newTacticsProbs[j]);
                dLogits[j] = dLogits[j] + (-adv * (ratio * dp_dlogit / newTacticsProbs[ex.tactic]));
            }
        }
        
        let entropy = 0;
        const dEntropy_dLogits = new Float32Array(N_TACTICS);
        for (let j = 0; j < N_TACTICS; j++) {
            let sum = 0;
            for (let i = 0; i < N_TACTICS; i++) {
                const pi = newTacticsProbs[i];
                const dH_dp = -(Math.log(pi + EPS) + 1);
                const indicator = (i === j) ? 1 : 0;
                const dp_dlogit = pi * (indicator - newTacticsProbs[j]);
                sum = sum + (dH_dp * dp_dlogit);
            }
            dEntropy_dLogits[j] = sum;
            entropy = entropy - (newTacticsProbs[j] * Math.log(newTacticsProbs[j] + EPS));
            dLogits[j] = dLogits[j] - (this.entropyCoef * dEntropy_dLogits[j]);
        }
        const dh_tactics = p.tacticsHead.backward(dLogits);
        
        // TARGET
        const newScores = new Float32Array(MAX_ENEMIES);
        const validCount = ex.validCount || 0;
        for (let k = 0; k < MAX_ENEMIES; k++) {
            if (!ex.enemyFeatures || !ex.enemyFeatures[k]) {
                newScores[k] = -100;
                continue;
            }
            const concat = new Float32Array(96 + MAX_ENEMY_FEATURES);
            for (let i = 0; i < 96; i++) {
                concat[i] = h[i];
            }
            for (let i = 0; i < MAX_ENEMY_FEATURES; i++) {
                concat[96 + i] = ex.enemyFeatures[k][i];
            }
            newScores[k] = p.targetHead.forward(concat)[0];
        }
        
        const newTargetProbs = new Float32Array(MAX_ENEMIES);
        const oldTargetProbs = ex.targetProbs || new Float32Array(MAX_ENEMIES).fill(1 / MAX_ENEMIES);
        
        if (validCount > 0) {
            let maxN = -Infinity;
            for (let k = 0; k < MAX_ENEMIES; k++) {
                if (newScores[k] > maxN) {
                    maxN = newScores[k];
                }
            }
            let sumN = 0;
            for (let k = 0; k < MAX_ENEMIES; k++) {
                if (newScores[k] > -50) {
                    newTargetProbs[k] = Math.exp(newScores[k] - maxN);
                    sumN = sumN + newTargetProbs[k];
                }
            }
            if (sumN > EPS) {
                for (let k = 0; k < MAX_ENEMIES; k++) {
                    newTargetProbs[k] = newTargetProbs[k] / sumN;
                }
            }
        }
        
        const oldProbT = oldTargetProbs[ex.targetIdx];
        const targetRatio = newTargetProbs[ex.targetIdx] / Math.max(oldProbT, EPS);
        const targetClippedRatio = clamp(targetRatio, 1 - this.clipEps, 1 + this.clipEps);
        const targetLoss = -Math.min(targetRatio * adv, targetClippedRatio * adv);
        const isTargetClipped = (targetRatio < 1 - this.clipEps && adv > 0) || (targetRatio > 1 + this.clipEps && adv < 0);
        
        const dTargetScores = new Float32Array(MAX_ENEMIES);
        if (!isTargetClipped && validCount > 0 && newTargetProbs[ex.targetIdx] > 0.01) {
            for (let k = 0; k < MAX_ENEMIES; k++) {
                if (newTargetProbs[k] === 0) {
                    continue;
                }
                const indicator = (ex.targetIdx === k) ? 1 : 0;
                const dp_dscore = newTargetProbs[ex.targetIdx] * (indicator - newTargetProbs[k]);
                dTargetScores[k] = -adv * (targetRatio * dp_dscore / newTargetProbs[ex.targetIdx]);
            }
        }
        
        const dh_target = new Float32Array(96);
        for (let k = 0; k < MAX_ENEMIES; k++) {
            if (!ex.enemyFeatures || !ex.enemyFeatures[k] || dTargetScores[k] === 0) {
                continue;
            }
            const concat = new Float32Array(96 + MAX_ENEMY_FEATURES);
            for (let i = 0; i < 96; i++) {
                concat[i] = h[i];
            }
            for (let i = 0; i < MAX_ENEMY_FEATURES; i++) {
                concat[96 + i] = ex.enemyFeatures[k][i];
            }
            p.targetHead.forward(concat);
            const dConcat = p.targetHead.backward(new Float32Array([dTargetScores[k]]));
            for (let i = 0; i < 96; i++) {
                dh_target[i] = dh_target[i] + dConcat[i];
            }
        }
        
        // LOW-LEVEL
        const lowMean = p.lowMeanHead.forward(h);
        const lowLogStd = p.lowLogStdHead.forward(h);
        let lowLogProb = 0;
        const dMean = new Float32Array(LOW_DIM);
        const dLogStd = new Float32Array(LOW_DIM);
        
        for (let i = 0; i < LOW_DIM; i++) {
            const std = Math.exp(clamp(lowLogStd[i], -5, 2));
            const z = (ex.actionSamples[i] - lowMean[i]) / std;
            const actionI = ex.action[i];
            
            dMean[i] = z / std;
            dLogStd[i] = (z * z) - 1;
            
            // FIX #1 & #2: Математически строгий Якобиан для tanh squashing (chain rule)
            // d/dμ [-log(1-a^2)] = -2 * a / std
            // d/d(log σ) [-log(1-a^2)] = -2 * a * z
            dMean[i] = dMean[i] + ((-2 * actionI) / std);
            dLogStd[i] = dLogStd[i] + ((-2 * actionI) * z);
            
            // FIX #1: Исправлен знак (минус) перед correction, как в forward
            const logP = -0.5 * Math.log(2 * Math.PI) - lowLogStd[i] - 0.5 * (z * z);
            const correction = Math.log(1 - (actionI * actionI) + EPS);
            lowLogProb = lowLogProb + logP - correction;
        }
        
        const lowRatio = Math.exp(clamp(lowLogProb - ex.lowLogProb, -10, 10));
        const lowClippedRatio = clamp(lowRatio, 1 - this.clipEps, 1 + this.clipEps);
        const lowPolicyLoss = -Math.min(lowRatio * adv, lowClippedRatio * adv);
        const isLowClipped = (lowRatio < 1 - this.clipEps && adv > 0) || (lowRatio > 1 + this.clipEps && adv < 0);
        const gradScale = isLowClipped ? 0 : -adv * lowRatio;
        
        for (let i = 0; i < LOW_DIM; i++) {
            dMean[i] = dMean[i] * gradScale;
            dLogStd[i] = dLogStd[i] * gradScale;
        }
        
        const dh_lowMean = p.lowMeanHead.backward(dMean);
        const dh_lowLogStd = p.lowLogStdHead.backward(dLogStd);
        
        // VALUE
        const newValue = p.valueHead.forward(h)[0];
        const valueLoss = (newValue - ex.return_) * (newValue - ex.return_);
        const dh_value = p.valueHead.backward(new Float32Array([2 * this.valueCoef * (newValue - ex.return_)]));
        
        // COMBINE
        const dh = new Float32Array(96);
        for (let i = 0; i < 96; i++) {
            dh[i] = dh_tactics[i] + dh_target[i] + dh_lowMean[i] + dh_lowLogStd[i] + dh_value[i];
        }
        const dh_pre = reluBackward(h_pre, dh);
        p.policyFC.backward(dh_pre);
        p.encoder.backward(dh);
        
        return {
            policy: policyLoss + lowPolicyLoss,
            value: valueLoss,
            entropy: entropy,
            target: targetLoss
        };
    }
}

/* ═══════════════════════════════════════════════════════════════════════
   6. COMBAT AI CORE (FULLY EXPANDED)
═══════════════════════════════════════════════════════════════════════ */

class CombatCore {
    constructor() {
        this.targetAssignments = new Map();
    }

    calculateLeadShot(shooter, target, bulletSpeed) {
        let t = dist(shooter.pos, target.pos) / bulletSpeed;
        let predX = target.pos.x + (target.vel.x * t);
        let predY = target.pos.y + (target.vel.y * t);
        
        for (let i = 0; i < 3; i++) {
            const newDist = Math.hypot(predX - shooter.pos.x, predY - shooter.pos.y);
            const newT = newDist / bulletSpeed;
            predX = target.pos.x + (target.vel.x * newT);
            predY = target.pos.y + (target.vel.y * newT);
        }
        return Math.atan2(predY - shooter.pos.y, predX - shooter.pos.x);
    }

    assessThreatLevel(tank, enemy) {
        let threat = 0;
        const d = dist(tank.pos, enemy.pos);
        threat = threat + (Math.max(0, 1 - (d / 500)) * 30);
        
        const aimAtMe = Math.atan2(tank.pos.y - enemy.pos.y, tank.pos.x - enemy.pos.x);
        const aimError = Math.abs(angDiff(enemy.turret, aimAtMe));
        threat = threat + (Math.max(0, 1 - (aimError / 0.5)) * 40);
        threat = threat + ((1 - (enemy.hp / enemy.maxHp)) * 15);
        
        let assignedCount = 0;
        this.targetAssignments.forEach(function(enemyId) {
            if (enemyId === enemy.id) {
                assignedCount = assignedCount + 1;
            }
        });
        threat = threat - (assignedCount * 8);
        
        const relativeVelX = enemy.vel.x - tank.vel.x;
        const relativeVelY = enemy.vel.y - tank.vel.y;
        const approachSpeed = -((relativeVelX * Math.cos(aimAtMe)) + (relativeVelY * Math.sin(aimAtMe)));
        threat = threat + (Math.max(0, approachSpeed / 3) * 15);
        
        return Math.max(0, threat);
    }

    assignTargetsGlobal(tanks) {
        const alive = [];
        for (let i = 0; i < tanks.length; i++) {
            if (tanks[i].alive) {
                alive.push(tanks[i]);
            }
        }
        
        const enemies = [];
        const allies = [];
        for (let i = 0; i < alive.length; i++) {
            if (alive[i].team === 'red') {
                enemies.push(alive[i]);
            } else if (alive[i].team === 'blue') {
                allies.push(alive[i]);
            }
        }
        
        if (enemies.length === 0 || allies.length === 0) {
            return new Map();
        }
        
        const pairs = [];
        for (let i = 0; i < allies.length; i++) {
            for (let j = 0; j < enemies.length; j++) {
                pairs.push({
                    threat: this.assessThreatLevel(allies[i], enemies[j]),
                    allyId: allies[i].id,
                    enemyId: enemies[j].id
                });
            }
        }
        
        pairs.sort(function(a, b) {
            return b.threat - a.threat;
        });
        
        const assignments = new Map();
        const usedEnemies = new Set();
        const usedAllies = new Set();
        
        for (let i = 0; i < pairs.length; i++) {
            const pair = pairs[i];
            if (!usedAllies.has(pair.allyId) && !usedEnemies.has(pair.enemyId)) {
                assignments.set(pair.allyId, pair.enemyId);
                usedAllies.add(pair.allyId);
                usedEnemies.add(pair.enemyId);
            }
        }
        return assignments;
    }

    isLineOfSightClear(tank, target, tanks, walls) {
        const d = dist(tank.pos, target.pos);
        
        // FIX #5: Защита от деления на ноль при коллизии/спавне
        if (d < 1) {
            return false;
        }
        
        const step = 10;
        const dx = (target.pos.x - tank.pos.x) / d;
        const dy = (target.pos.y - tank.pos.y) / d;
        
        for (let s = 16; s < d - 16; s = s + step) {
            const px = tank.pos.x + (dx * s);
            const py = tank.pos.y + (dy * s);
            if (pointInWall(px, py, walls)) {
                return false;
            }
        }
        
        const angleToTarget = Math.atan2(target.pos.y - tank.pos.y, target.pos.x - tank.pos.x);
        
        for (let i = 0; i < tanks.length; i++) {
            const t = tanks[i];
            if (t.id === tank.id || !t.alive || t.team !== tank.team) {
                continue;
            }
            if (dist(tank.pos, t.pos) > d) {
                continue;
            }
            const angleToAlly = Math.atan2(t.pos.y - tank.pos.y, t.pos.x - tank.pos.x);
            if (Math.abs(angDiff(angleToAlly, angleToTarget)) < 0.15) {
                return false;
            }
        }
        return true;
    }
}
